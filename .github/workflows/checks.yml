name: Build and regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Java checks and both Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Run host regressions, build parity and restore fixtures
        run: sh tests/check-all.sh
      - name: Validate remote protocol
        run: |
          python3 -m venv "$RUNNER_TEMP/protocol-venv"
          "$RUNNER_TEMP/protocol-venv/bin/pip" install -r protocol/requirements-dev.txt
          "$RUNNER_TEMP/protocol-venv/bin/python" tests/check-protocol.py
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Ignore yes's SIGPIPE, but retain sdkmanager's exit status.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build and verify launcher APK
        run: sh build-launcher.sh
      - name: Build and verify remote APK
        run: sh build-launcher.sh remote
      - name: Check packaged SDKs, bytecode and launcher contents
        run: python3 tests/check-build-parity.py --apks
      - name: Report validation scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Family TV checks passed
          - Row presentation, row focus and navigation timing regression checks
          - Remote input and protocol proof checks
          - JSON, manifest and shell syntax checks
          - Both APK builds and development signature verification

          **No TV or emulator tests ran.** Rendering, Fire OS HOME/BACK behavior,
          playback, device memory and measured latency still need device testing.
          The runner creates a temporary development key; it is not uploaded.
          SUMMARY

  mobile:
    name: Flutter companion and Java interop
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLUTTER_BIN: ${{ github.workspace }}/flutter-sdk/bin/flutter
      FAMILYTV_REQUIRE_INTEROP: '1'
    steps:
      - name: Check out Family TV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the project's Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: ab2912035e160d9cad6306df307576da6128ebdb
          path: flutter-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned Flutter revision
        run: test "$(git -C flutter-sdk rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
      - name: Resolve locked dependencies
        run: sh scripts/flutter.sh pub get --enforce-lockfile
      - name: Analyze and test the phone companion
        run: sh scripts/check-mobile.sh
      - name: Exercise the Dart client against the Java TLS/WSS server
        run: sh scripts/check-remote-interop.sh
      - name: Build the phone debug APK
        run: sh scripts/flutter.sh build apk --debug
      - name: Verify the dependency lock
        run: git diff --exit-code -- mobile/pubspec.lock

  ios-simulator:
    name: iOS simulator build (no signing or device acceptance)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      FLUTTER_BIN: ${{ github.workspace }}/flutter-sdk/bin/flutter
    steps:
      - name: Check out Family TV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: ab2912035e160d9cad6306df307576da6128ebdb
          path: flutter-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Flutter and available Apple toolchain
        run: |
          test "$(git -C flutter-sdk rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Resolve locked dependencies
        run: sh scripts/flutter.sh pub get --enforce-lockfile
      - name: Build the iOS simulator app without signing
        run: sh scripts/flutter.sh build ios --simulator --debug --no-codesign
      - name: Verify dependency lock and report scope
        run: |
          git diff --exit-code -- mobile/pubspec.lock
          echo 'iOS simulator compilation only: no phone/TV, pairing, permissions, memory or latency acceptance.' >> "$GITHUB_STEP_SUMMARY"
